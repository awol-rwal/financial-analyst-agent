[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-analyst-mas"
version = "0.3.0"
description = "Hybrid Financial Analyst: initial look, DCF valuation and optional independent AI review"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
workflow = ["langgraph>=1.0,<2"]
llm = ["openai>=2.0,<3"]
test = ["pytest>=8"]

[project.scripts]
financial-analyst-mas = "financial_analyst_agent.cli:main"
valuation-mas = "financial_analyst_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
