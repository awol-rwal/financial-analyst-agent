[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valuation-mas"
version = "0.1.0"
description = "Auditable multi-agent company valuation workflow with deterministic DCF calculations"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
workflow = ["langgraph>=1.0,<2"]
llm = ["openai>=2.0,<3"]
test = ["pytest>=8"]

[project.scripts]
valuation-mas = "valuation_mas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
